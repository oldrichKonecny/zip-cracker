[package]
name = "zip_pass_cracker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = "8"
pbkdf2 = { version = "0.13", default-features = false }
sha1 = "0.11"
lopdf = "0.41"
md-5 = "0.11"
sha2 = "0.11"
aes = "0.9"
cbc = "0.2"
cipher = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
