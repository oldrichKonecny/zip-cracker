[build]
# Build for the host CPU so the `aes` and `sha2` crates use the hardware
# AES/SHA instructions (ARMv8 crypto extensions on Apple Silicon, AES-NI/SHA-NI
# on x86) via compile-time target features instead of runtime dispatch.
#
# Since `aes` 0.9 and `sha2` 0.11 the hardware backends are compiled in by
# default with runtime CPU detection (no `aes_armv8` cfg or "asm" feature
# needed); target-cpu=native just lets the compiler select them statically.
rustflags = ["-C", "target-cpu=native"]
